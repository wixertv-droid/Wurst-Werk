<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lager - Wurstwerk</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
    <style>
        .glass-card-detail { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; font-size: 0.85rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; }
        .glass-row { display: flex; justify-content: space-between; }
        .glass-row.final { color: #4caf50; font-weight: bold; font-size: 1rem; margin-top: 5px; }
        #glass-customer-overlay { display: none; background: #1a1a1a; border: 1px solid #4d4dff; border-radius: 12px; padding: 15px; margin-top: 10px; animation: slideDown 0.3s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header>Lagerbestand</header>

    <main>
        <div class="dashboard-grid" style="margin-bottom: 20px;">
            <div class="stat-card" style="border-top: 3px solid #4caf50;">
                <span class="material-symbols-outlined" style="color: #4caf50;">payments</span>
                <span id="stat-warenwert" class="stat-value">0.00</span>
                <span class="stat-label">Warenwert (€)</span>
            </div>

            <div class="stat-card" style="border-top: 3px solid #4d4dff; cursor: pointer;" onclick="app.toggleGlassList()">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span class="material-symbols-outlined" style="color: #4d4dff;">recycling</span>
                    <span class="material-symbols-outlined" style="font-size: 1.2rem; color: #555;">expand_more</span>
                </div>
                <div class="glass-card-detail">
                    <div class="glass-row"><span>Gekauft:</span> <b id="glass-bought">0</b></div>
                    <div class="glass-row" style="color: var(--accent-danger);"><span>Beim Kunden:</span> <b id="glass-with-customer">0</b></div>
                    <div class="glass-row final"><span>Im Regal:</span> <b id="glass-available">0</b></div>
                </div>
            </div>
        </div>

        <div id="glass-customer-overlay">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h3 style="margin: 0; font-size: 1rem; color: #4d4dff;">Gläser im Umlauf</h3>
                <span class="material-symbols-outlined" style="cursor:pointer;" onclick="app.toggleGlassList()">close</span>
            </div>
            <div id="glass-customer-list"></div>
        </div>

        <div class="filter-container" style="display: flex; gap: 10px; overflow-x: auto; padding: 15px 0;">
            <button class="filter-btn active" onclick="app.setFilter('Alle', this)">Alles</button>
            <button class="filter-btn" onclick="app.setFilter('Fleisch', this)">🥩 Fleisch</button>
            <button class="filter-btn" onclick="app.setFilter('Gewürz', this)">🧂 Gewürze</button>
            <button class="filter-btn" onclick="app.setFilter('Pfandglas', this)">🫙 Gläser</button>
        </div>

        <button class="action-btn" style="background-color: #2e7d32; color: white; margin-bottom: 25px; height: 50px;" onclick="window.location.href='einkauf.html'">
            <span class="material-symbols-outlined">add_circle</span> Neuen Artikel eintragen
        </button>

        <div class="section-title" id="list-title">Lagerliste</div>
        <div id="inventory-list"></div>

        <div id="recent-section" style="margin-top: 30px; border-top: 1px solid #333; padding-top: 20px;">
            <div class="section-title" style="color: var(--accent-amber);">🆕 Zuletzt hinzugefügt</div>
            <div id="recent-list"></div>
        </div>

    </main>

    <nav>
        <div class="nav-item" onclick="window.location.href='index.html'"><span class="material-symbols-outlined">dashboard</span><span>Home</span></div>
        <div class="nav-item" onclick="window.location.href='rezepte.html'"><span class="material-symbols-outlined">menu_book</span><span>Rezepte</span></div>
        <div class="nav-item active"><span class="material-symbols-outlined">inventory</span><span>Lager</span></div>
        <div class="nav-item" onclick="window.location.href='kunden.html'"><span class="material-symbols-outlined">group</span><span>Kunden</span></div>
    </nav>

    <script src="db.js"></script>
    <script src="app.js"></script>
</body>
</html>
