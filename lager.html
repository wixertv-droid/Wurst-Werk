<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lager - Wurstwerk</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>Lagerbestand</header>
    <main>
        <div class="dashboard-grid">
            <div class="stat-card" style="border-top: 3px solid var(--accent-amber);">
                <h3 style="margin: 0 0 5px 0;">Warenwert</h3>
                <p style="font-size: 1.5rem; margin: 0; font-weight: bold;"><span id="stat-warenwert">0.00</span> €</p>
            </div>
            <div class="stat-card" style="border-top: 3px solid var(--accent-amber);">
                <h3 style="margin: 0 0 5px 0;">Gläser (Frei)</h3>
                <p style="font-size: 0.9rem; margin: 0; color: #ccc;">
                    250ml: <b id="glass-250-available" style="color: white; font-size: 1.1rem;">0</b><br>
                    400ml: <b id="glass-400-available" style="color: white; font-size: 1.1rem;">0</b>
                </p>
            </div>
        </div>

        <button class="action-btn" style="background-color: var(--accent-amber); color: #000; margin-top: 20px; margin-bottom: 25px; height: 50px;" onclick="window.lagerManager.openEditor()">
            <span class="material-symbols-outlined">add</span> Neuer Artikel
        </button>

        <div id="inventory-list-container">
            <p class="text-muted" style="text-align: center;">Lade Lagerbestand...</p>
        </div>

        <div id="inventory-editor" style="display: none; background: #1a1a1a; padding: 20px; border-radius: 12px; border: 1px solid #333; margin-bottom: 30px;">
            <h3 id="editor-title" style="margin-top: 0; color: var(--accent-amber);">Neuer Artikel</h3>
            <input type="hidden" id="edit-id">
            
            <label style="display:block; color:var(--text-muted); font-size:0.8rem; margin-bottom:5px;">Name</label>
            <input type="text" id="edit-name" style="width:100%; padding:10px; background:#222; border:1px solid #444; color:white; border-radius:6px; margin-bottom:15px;">
            
            <label style="display:block; color:var(--text-muted); font-size:0.8rem; margin-bottom:5px;">Kategorie</label>
            <select id="edit-category" style="width:100%; padding:10px; background:#222; border:1px solid #444; color:white; border-radius:6px; margin-bottom:15px;">
                <option value="Fleisch">Fleisch</option>
                <option value="Gewürze">Gewürze</option>
                <option value="Darm">Darm / Hülle</option>
                <option value="Pfandglas">Pfandglas</option>
                <option value="Verpackung">Verpackung</option>
                <option value="Maschine">Maschine</option>
            </select>

            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <div style="flex: 1;">
                    <label style="display:block; color:var(--text-muted); font-size:0.8rem; margin-bottom:5px;">Menge</label>
                    <input type="number" id="edit-amount" step="0.1" style="width:100%; padding:10px; background:#222; border:1px solid #444; color:white; border-radius:6px;">
                </div>
                <div style="flex: 1;">
                    <label style="display:block; color:var(--text-muted); font-size:0.8rem; margin-bottom:5px;">Einheit</label>
                    <select id="edit-unit" style="width:100%; padding:10px; background:#222; border:1px solid #444; color:white; border-radius:6px;">
                        <option value="g">g</option>
                        <option value="kg">kg</option>
                        <option value="ml">ml</option>
                        <option value="Stk">Stück</option>
                        <option value="m">Meter</option>
                    </select>
                </div>
            </div>

            <label style="display:block; color:var(--text-muted); font-size:0.8rem; margin-bottom:5px;">Gesamtpreis (€)</label>
            <input type="number" id="edit-price" step="0.01" style="width:100%; padding:10px; background:#222; border:1px solid #444; color:white; border-radius:6px; margin-bottom:20px;">

            <div style="display: flex; gap: 10px;">
                <button style="flex: 1; background: #333; color: white; border: none; padding: 12px; border-radius: 6px;" onclick="window.lagerManager.closeEditor()">Abbrechen</button>
                <button style="flex: 1; background: #4caf50; color: white; border: none; padding: 12px; border-radius: 6px;" onclick="window.lagerManager.saveItem()">Speichern</button>
            </div>
        </div>

    </main>

    <nav>
        <div class="nav-item" onclick="window.location.href='index.html'"><span class="material-symbols-outlined">dashboard</span><span>Home</span></div>
        <div class="nav-item" onclick="window.location.href='rezepte.html'"><span class="material-symbols-outlined">menu_book</span><span>Rezepte</span></div>
        <div class="nav-item active"><span class="material-symbols-outlined">inventory</span><span>Lager</span></div>
        <div class="nav-item" onclick="window.location.href='kunden.html'"><span class="material-symbols-outlined">group</span><span>Kunden</span></div>
    </nav>

    <script src="db.js?v=8"></script>
    <script src="app.js?v=8"></script>
    <script src="lager.js?v=8"></script>
</body>
</html>
