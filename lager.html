<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lager - Wurstwerk</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
    <style>
        .lager-input, .lager-select {
            width: 100%; padding: 15px; background: #222; border: 1px solid #444;
            color: white; border-radius: 12px; font-size: 1.1rem; box-sizing: border-box;
            margin-bottom: 15px;
        }
        .lager-input:focus, .lager-select:focus { border-color: var(--accent-amber); outline: none; background: #2a2a2a; }
        .editor-label { display: block; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 8px; text-transform: uppercase; }
    </style>
</head>
<body>

    <header>Lagerbestand</header>

    <main>
        <div id="inventory-list-view">
            <div class="dashboard-grid">
                <div class="stat-card" style="border-top: 3px solid var(--accent-amber);">
                    <h3 style="margin: 0 0 5px 0;">Warenwert</h3>
                    <p style="font-size: 1.5rem; margin: 0; font-weight: bold;"><span id="stat-warenwert">0.00</span> €</p>
                </div>
                <div class="stat-card" style="border-top: 3px solid var(--accent-amber);">
                    <h3 style="margin: 0 0 5px 0;">Gläser (Frei)</h3>
                    <p style="font-size: 0.9rem; margin: 0; color: #ccc;">
                        250ml: <b id="glass-250-available" style="color: white; font-size: 1.1rem;">0</b><br>
                        400ml: <b id="glass-400-available" style="color: white; font-size: 1.1rem;">0</b>
                    </p>
                </div>
            </div>

            <button class="action-btn" style="background-color: var(--accent-amber); color: #000; margin-top: 20px; margin-bottom: 25px; height: 55px; font-size: 1.1rem;" onclick="window.lagerManager.openEditor()">
                <span class="material-symbols-outlined">add_circle</span> Neuer Artikel
            </button>

            <div id="inventory-list-container">
                <p class="text-muted" style="text-align: center;">Lade Lagerbestand...</p>
            </div>
        </div>

        <div id="inventory-editor-view" style="display: none;">
            <div class="sub-header" style="padding: 0 0 15px 0; margin-bottom: 20px; border-bottom: 1px solid #333;">
                <div class="back-btn" onclick="window.lagerManager.closeEditor()"><span class="material-symbols-outlined">arrow_back_ios</span> Zurück</div>
                <div class="header-title" id="editor-title" style="color: white;">Neuer Artikel</div>
            </div>

            <div class="stat-card" style="border-top: 3px solid var(--accent-amber); margin-bottom: 30px;">
                <input type="hidden" id="edit-id">
                
                <label class="editor-label">Name des Artikels</label>
                <input type="text" id="edit-name" class="lager-input" placeholder="z.B. Schweinenacken">
                
                <label class="editor-label">Kategorie</label>
                <select id="edit-category" class="lager-select">
                    <option value="Fleisch">Fleisch</option>
                    <option value="Gewürze">Gewürze</option>
                    <option value="Darm">Darm / Hülle</option>
                    <option value="Pfandglas">Pfandglas</option>
                    <option value="Verpackung">Verpackung</option>
                    <option value="Maschine">Maschine</option>
                </select>

                <div style="display: flex; gap: 15px;">
                    <div style="flex: 1;">
                        <label class="editor-label">Menge</label>
                        <input type="number" id="edit-amount" step="0.1" class="lager-input" placeholder="0">
                    </div>
                    <div style="flex: 1;">
                        <label class="editor-label">Einheit</label>
                        <select id="edit-unit" class="lager-select">
                            <option value="g">g</option>
                            <option value="kg">kg</option>
                            <option value="ml">ml</option>
                            <option value="Stk">Stück</option>
                            <option value="m">Meter</option>
                        </select>
                    </div>
                </div>

                <label class="editor-label">Gesamtpreis (€)</label>
                <input type="number" id="edit-price" step="0.01" class="lager-input" placeholder="0.00" style="margin-bottom: 0;">
            </div>

            <button class="action-btn" style="background-color: #2e7d32; color: white; height: 55px;" onclick="window.lagerManager.saveItem()">
                <span class="material-symbols-outlined">save</span> Artikel speichern
            </button>
        </div>

    </main>

    <nav>
        <div class="nav-item" onclick="window.location.href='index.html'"><span class="material-symbols-outlined">dashboard</span><span>Home</span></div>
        <div class="nav-item" onclick="window.location.href='rezepte.html'"><span class="material-symbols-outlined">menu_book</span><span>Rezepte</span></div>
        <div class="nav-item active"><span class="material-symbols-outlined">inventory</span><span>Lager</span></div>
        <div class="nav-item" onclick="window.location.href='kunden.html'"><span class="material-symbols-outlined">group</span><span>Kunden</span></div>
    </nav>

    <script src="db.js?v=9"></script>
    <script src="app.js?v=9"></script>
    <script src="lager.js?v=9"></script>
</body>
</html>
