<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lager - Wurstwerk</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>Lagerbestand</header>

    <main>
        <div class="stat-card" style="border-top: 3px solid #4caf50; margin-bottom: 25px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <span class="stat-label">Gesamter Warenwert</span>
                    <br>
                    <span id="stat-warenwert" class="stat-value">0.00</span> <span style="font-size: 1.2rem;">€</span>
                </div>
                <span class="material-symbols-outlined" style="color: #4caf50; font-size: 2.5rem;">payments</span>
            </div>
        </div>

        <div class="section-title" style="color: #4d4dff;">🫙 Gläser-Zentrale</div>
        <div class="stat-card" style="border-top: 3px solid #4d4dff; margin-bottom: 25px; padding-bottom: 5px;">
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <div>
                    <div style="font-size: 1.1rem; font-weight: bold;">250ml Gläser</div>
                    <div style="font-size: 0.8rem; color: var(--accent-danger);">Beim Kunden: <span id="glass-250-out">0</span></div>
                </div>
                <div style="text-align: right;">
                    <div style="font-size: 1.4rem; color: #4caf50; font-weight: bold;" id="glass-250-available">0</div>
                    <div style="font-size: 0.8rem; color: var(--text-muted);">im Regal</div>
                </div>
            </div>
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button class="action-btn" style="background: #111; border: 1px solid #4caf50; color: #4caf50;" onclick="app.adjustGlass('250', 'add')">
                    <span class="material-symbols-outlined">add</span> Eingang
                </button>
                <button class="action-btn" style="background: #111; border: 1px solid var(--accent-danger); color: var(--accent-danger);" onclick="app.adjustGlass('250', 'remove')">
                    <span class="material-symbols-outlined">remove</span> Abziehen
                </button>
            </div>

            <hr style="border: 0; border-top: 1px dashed #333; margin: 0 0 15px 0;">

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <div>
                    <div style="font-size: 1.1rem; font-weight: bold;">400ml Gläser</div>
                    <div style="font-size: 0.8rem; color: var(--accent-danger);">Beim Kunden: <span id="glass-400-out">0</span></div>
                </div>
                <div style="text-align: right;">
                    <div style="font-size: 1.4rem; color: #4caf50; font-weight: bold;" id="glass-400-available">0</div>
                    <div style="font-size: 0.8rem; color: var(--text-muted);">im Regal</div>
                </div>
            </div>
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <button class="action-btn" style="background: #111; border: 1px solid #4caf50; color: #4caf50;" onclick="app.adjustGlass('400', 'add')">
                    <span class="material-symbols-outlined">add</span> Eingang
                </button>
                <button class="action-btn" style="background: #111; border: 1px solid var(--accent-danger); color: var(--accent-danger);" onclick="app.adjustGlass('400', 'remove')">
                    <span class="material-symbols-outlined">remove</span> Abziehen
                </button>
            </div>

            <div style="text-align: center; border-top: 1px solid #333; padding: 12px 0; cursor: pointer; color: #4d4dff; font-size: 0.9rem;" onclick="app.toggleGlassList()">
                <span class="material-symbols-outlined" style="vertical-align: middle; font-size: 1.1rem;">group</span> 
                Zeige Kunden mit Pfandschulden
            </div>
            <div id="glass-customer-overlay" style="display: none; padding-top: 10px;">
                <div id="glass-customer-list"></div>
            </div>
        </div>

        <div class="filter-container" style="display: flex; gap: 10px; overflow-x: auto; padding-bottom: 15px;">
            <button class="filter-btn active" onclick="app.setFilter('Alle', this)">Alles</button>
            <button class="filter-btn" onclick="app.setFilter('Fleisch', this)">🥩 Fleisch</button>
            <button class="filter-btn" onclick="app.setFilter('Gewürz', this)">🧂 Gewürze</button>
        </div>

        <button class="action-btn" style="background-color: #2e7d32; color: white; margin-bottom: 25px; height: 50px;" onclick="window.location.href='einkauf.html'">
            <span class="material-symbols-outlined">add_circle</span> Fleisch / Gewürz eintragen
        </button>

        <div class="section-title" id="list-title">Lagerliste</div>
        <div id="inventory-list"></div>

        <div id="recent-section" style="margin-top: 30px; border-top: 1px solid #333; padding-top: 20px;">
            <div class="section-title" style="color: var(--accent-amber);">🆕 Zuletzt hinzugefügt</div>
            <div id="recent-list"></div>
        </div>
    </main>

    <nav>
        <div class="nav-item" onclick="window.location.href='index.html'"><span class="material-symbols-outlined">dashboard</span><span>Home</span></div>
        <div class="nav-item" onclick="window.location.href='rezepte.html'"><span class="material-symbols-outlined">menu_book</span><span>Rezepte</span></div>
        <div class="nav-item active"><span class="material-symbols-outlined">inventory</span><span>Lager</span></div>
        <div class="nav-item" onclick="window.location.href='kunden.html'"><span class="material-symbols-outlined">group</span><span>Kunden</span></div>
    </nav>

    <script src="db.js"></script>
    <script src="app.js"></script>
</body>
</html>
