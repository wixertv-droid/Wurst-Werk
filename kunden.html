<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kunden - Wurstwerk</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
    <style>
        .kunden-card { background: #1a1a1a; border-radius: 12px; padding: 15px; margin-bottom: 10px; border: 1px solid #222; display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .icon-box { background: #2a2a2a; padding: 12px; border-radius: 8px; display: flex; justify-content: center; align-items: center; }
        
        .kunden-input { width: 100%; box-sizing: border-box; padding: 15px; background: #222; border: 1px solid #444; color: white; border-radius: 12px; font-size: 1.1rem; margin-bottom: 15px; outline: none; }
        .kunden-input:focus { border-color: #4caf50; }
        .editor-label { display: block; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 5px; text-transform: uppercase; }
        
        .pfand-box { background: #222; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px dashed #444; }
        .outline-btn { flex: 1; background: transparent; padding: 10px; border-radius: 8px; font-weight: bold; display: flex; justify-content: center; align-items: center; gap: 5px; cursor: pointer; font-size: 0.95rem; }
        .outline-btn.red { border: 1px solid var(--accent-danger); color: var(--accent-danger); }
        .outline-btn.green { border: 1px solid #4caf50; color: #4caf50; }
    </style>
</head>
<body>
    <header style="text-transform: uppercase; letter-spacing: 2px;">Kunden & Pfand</header>
    
    <main>
        <div id="kunden-list-view">
            
            <button class="action-btn" style="background-color: var(--accent-amber); color: #000; margin-bottom: 25px; height: 60px; font-size: 1.1rem;" onclick="window.kundenManager.openEditor()">
                <span class="material-symbols-outlined">person_add</span> Neuen Kunden anlegen
            </button>

            <div style="color: var(--text-muted); text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; margin-bottom: 10px;">Kundenkartei</div>
            <div id="kunden-list-container">
                <p class="text-muted" style="text-align: center;">Lade Kunden...</p>
            </div>
        </div>

        <div id="kunden-editor-view" style="display: none;">
            <div class="sub-header" style="padding: 0 0 15px 0; margin-bottom: 20px; border-bottom: 1px solid #333;">
                <div class="back-btn" onclick="window.kundenManager.closeEditor()"><span class="material-symbols-outlined">arrow_back_ios</span> Zurück</div>
                <div class="header-title" id="editor-title" style="color: white;">Kunden Profil</div>
            </div>

            <div style="background: #1a1a1a; padding: 20px; border-radius: 12px; margin-bottom: 30px; border: 1px solid #222;">
                <input type="hidden" id="edit-id">
                
                <label class="editor-label">Name des Kunden</label>
                <input type="text" id="edit-name" class="kunden-input" placeholder="z.B. Max Mustermann">
                
                <label class="editor-label">Kontakt / Info (Optional)</label>
                <input type="text" id="edit-contact" class="kunden-input" placeholder="Telefon oder Adresse">

                <hr style="border: 0; border-top: 1px dashed #444; margin: 25px 0;">
                
                <div style="color: #4d4dff; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 1px; margin-bottom: 15px; display: flex; align-items: center; gap: 5px; font-weight: bold;">
                    <span class="material-symbols-outlined">kitchen</span> Ausgeliehene Gläser
                </div>

                <div class="pfand-box">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <span style="font-weight: bold;">250ml Gläser</span>
                        <span style="font-size: 1.5rem; color: var(--accent-danger); font-weight: bold;" id="edit-pfand-250">0</span>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button class="outline-btn red" onclick="window.kundenManager.changePfand('250', 1)"><span class="material-symbols-outlined">arrow_outward</span> Kunde bekommt</button>
                        <button class="outline-btn green" onclick="window.kundenManager.changePfand('250', -1)"><span class="material-symbols-outlined">assignment_return</span> Kunde gibt zurück</button>
                    </div>
                </div>

                <div class="pfand-box">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <span style="font-weight: bold;">400ml Gläser</span>
                        <span style="font-size: 1.5rem; color: var(--accent-danger); font-weight: bold;" id="edit-pfand-400">0</span>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button class="outline-btn red" onclick="window.kundenManager.changePfand('400', 1)"><span class="material-symbols-outlined">arrow_outward</span> Kunde bekommt</button>
                        <button class="outline-btn green" onclick="window.kundenManager.changePfand('400', -1)"><span class="material-symbols-outlined">assignment_return</span> Kunde gibt zurück</button>
                    </div>
                </div>
            </div>

            <button class="action-btn" style="background-color: #4caf50; color: white; height: 60px; font-size: 1.1rem;" onclick="window.kundenManager.saveCustomer()">
                <span class="material-symbols-outlined">save</span> Profil Speichern
            </button>
        </div>

    </main>

    <nav>
        <div class="nav-item" onclick="window.location.href='index.html'"><span class="material-symbols-outlined">dashboard</span><span>Home</span></div>
        <div class="nav-item" onclick="window.location.href='rezepte.html'"><span class="material-symbols-outlined">menu_book</span><span>Rezepte</span></div>
        <div class="nav-item" onclick="window.location.href='lager.html'"><span class="material-symbols-outlined">inventory</span><span>Lager</span></div>
        <div class="nav-item active"><span class="material-symbols-outlined">group</span><span>Kunden</span></div>
    </nav>

    <script src="db.js?v=13"></script>
    <script src="app.js?v=13"></script>
    <script src="kunden.js?v=13"></script>
</body>
</html>
