<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Wurstwerk</title>
    <style>
        /* Unser Farb-Konzept: Modern Smokehouse */
        :root {
            --bg-color: #121212; /* Sehr dunkles Grau, fast Schwarz */
            --text-main: #f5f5f5;
            --accent-amber: #ff8c00; /* Glühendes Orange/Amber für Hitze & Rauch */
            --nav-bg: #1e1e1e;
        }
        
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Verhindert Text-Markieren, damit es sich wie eine App anfühlt */
            -webkit-user-select: none;
            user-select: none;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 20px;
            padding-top: env(safe-area-inset-top, 40px); /* Platz für die iPhone-Notch */
            text-align: center;
            background-color: var(--nav-bg);
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 3px;
            border-bottom: 2px solid var(--accent-amber);
            text-transform: uppercase;
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            font-weight: 300;
            letter-spacing: 1px;
            color: #aaa;
        }

        /* Der Rauch-Hub (Platzhalter für die Lottie-Animation später) */
        .smoke-hub {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: 2px dashed #444;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            transition: all 0.3s ease;
        }
        
        /* Zustand wenn geräuchert wird */
        .smoke-hub.active {
            border-color: var(--accent-amber);
            box-shadow: 0 0 30px rgba(255, 140, 0, 0.2);
        }

        /* Der glühende Timer */
        .timer-display {
            font-size: 3.5rem;
            font-family: 'Courier New', Courier, monospace;
            color: var(--accent-amber);
            margin-top: 30px;
            text-shadow: 0 0 15px rgba(255, 140, 0, 0.6);
        }

        /* Bottom Navigation (Die Menüleiste unten) */
        nav {
            background-color: var(--nav-bg);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            padding-bottom: env(safe-area-inset-bottom, 20px); /* Platz für den Home-Balken beim iPhone */
            border-top: 1px solid #333;
        }

        .nav-item {
            color: #666;
            text-decoration: none;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .nav-item.active {
            color: var(--accent-amber);
        }

        .icon {
            font-size: 1.6rem;
        }
    </style>
</head>
<body>

    <header>
        Wurstwerk
    </header>

    <main id="app-content">
        <h2>Der Räuchermeister</h2>
        
        <div class="smoke-hub active">
            <span style="font-size: 3rem;">🔥</span>
        </div>

        <div class="timer-display">
            00:00:00
        </div>
        
        <p style="color: #888; margin-top: 10px;">Bereit für den nächsten Durchgang</p>
    </main>

    <nav>
        <a href="#" class="nav-item active">
            <span class="icon">🏠</span>
            <span>Home</span>
        </a>
        <a href="#" class="nav-item">
            <span class="icon">📖</span>
            <span>Rezepte</span>
        </a>
        <a href="#" class="nav-item">
            <span class="icon">📦</span>
            <span>Lager</span>
        </a>
        <a href="#" class="nav-item">
            <span class="icon">💰</span>
            <span>Finanzen</span>
        </a>
    </nav>

    <script>
        // Hier kommt später unsere JavaScript-Logik rein!
        console.log("Wurstwerk App erfolgreich geladen!");
    </script>
</body>
</html>
