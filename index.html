<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wurstwerk</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="header-content">
            <span class="brand">WURSTWERK</span>
            <div class="header-stats">
                <span class="material-symbols-outlined">wifi</span>
                <small>Online</small>
            </div>
        </div>
    </header>

    <main id="app-content">
        
        <div id="view-einkauf" class="view active">
            <div class="section-title">
                <span class="material-symbols-outlined">add_shopping_cart</span> Wareneingang
            </div>
            
            <div class="purchase-container">
                <div class="input-row">
                    <div class="input-group">
                        <label>Produktname</label>
                        <input type="text" id="buy-name" placeholder="z.B. Bauch, Nacken..." onkeyup="assistant.checkExisting()">
                        <div id="duplicate-hint" class="hint-badge" style="display:none;">Bereits im Lager (wird addiert)</div>
                    </div>
                </div>
                
                <div class="input-row" style="display: flex; gap: 10px;">
                    <div class="input-group" style="flex: 2;">
                        <label>Menge</label>
                        <input type="number" id="buy-amount" placeholder="0">
                    </div>
                    <div class="input-group" style="flex: 1;">
                        <label>Einheit</label>
                        <select id="buy-unit" class="select-input">
                            <option value="kg">kg</option>
                            <option value="g">g</option>
                            <option value="Stk">Stk</option>
                        </select>
                    </div>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label>Gesamtpreis (€) - Optional</label>
                        <input type="number" step="0.01" id="buy-price" placeholder="0.00">
                    </div>
                </div>

                <button class="save-btn" onclick="assistant.processPurchase()">
                    <span class="material-symbols-outlined">add_task</span> Einlagern
                </button>
            </div>

            <div class="section-title" style="margin-top: 25px;">
                <span class="material-symbols-outlined">history</span> Kürzlich eingekauft
            </div>
            <div id="recent-purchases" class="recent-list">
                <p style="color: #666; font-size: 0.9rem; text-align: center;">Lade Daten...</p>
            </div>
        </div>

        <div id="view-lager" class="view" style="display:none;">
            <div class="section-title">
                <span class="material-symbols-outlined">inventory_2</span> Aktueller Bestand
            </div>
            <div class="search-bar">
                <input type="text" id="search-lager" placeholder="Lager durchsuchen..." onkeyup="app.filterLager()">
            </div>
            <div id="lager-list" class="lager-grid">
                </div>
        </div>

        <div id="view-produktion" class="view" style="display:none;">
            <div class="section-title">
                <span class="material-symbols-outlined">blender</span> Produktion
            </div>
            <p style="color: #888;">Produktions-Modul folgt hier.</p>
        </div>

    </main>

    <nav class="bottom-nav">
        <button onclick="app.switchView('view-lager')" id="nav-lager">
            <span class="material-symbols-outlined">inventory_2</span>Lager
        </button>
        <button onclick="app.switchView('view-einkauf')" id="nav-einkauf" class="active">
            <span class="material-symbols-outlined">shopping_cart</span>Einkauf
        </button>
        <button onclick="app.switchView('view-produktion')" id="nav-produktion">
            <span class="material-symbols-outlined">blender</span>Produktion
        </button>
    </nav>

    <script src="db.js"></script>
    <script src="assistant.js"></script>
    <script src="production.js"></script>
    <script src="app.js"></script>
</body>
</html>
