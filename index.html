<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - Wurstwerk</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>Wurstwerk Dashboard</header>

    <main>
        <div class="section-title">Übersicht</div>
        <div class="dashboard-grid">
            <div class="stat-card" style="border-top: 3px solid var(--accent-amber);">
                <span class="material-symbols-outlined" style="color: var(--accent-amber); font-size: 2rem;">euro_symbol</span>
                <h3 style="margin: 10px 0 5px 0;">Warenwert</h3>
                <p style="font-size: 1.5rem; margin: 0; font-weight: bold;"><span id="stat-wert">0.00</span> €</p>
            </div>
            <div class="stat-card" style="border-top: 3px solid var(--accent-amber);">
                <span class="material-symbols-outlined" style="color: var(--accent-amber); font-size: 2rem;">kitchen</span>
                <h3 style="margin: 10px 0 5px 0;">Leergut</h3>
                <p style="font-size: 0.9rem; margin: 0; color: #ccc;">
                    250ml: <b id="stat-glaeser-250" style="color: white; font-size: 1.1rem;">0</b><br>
                    400ml: <b id="stat-glaeser-400" style="color: white; font-size: 1.1rem;">0</b>
                </p>
            </div>
        </div>

        <div class="section-title" style="margin-top: 30px;">Laufende Produktionen & Timer</div>
        <div id="active-processes-list">
            <p class="text-muted" style="text-align: center;">Lade Prozesse...</p>
        </div>
    </main>

    <nav>
        <div class="nav-item active" onclick="window.location.href='index.html'"><span class="material-symbols-outlined">dashboard</span><span>Home</span></div>
        <div class="nav-item" onclick="window.location.href='rezepte.html'"><span class="material-symbols-outlined">menu_book</span><span>Rezepte</span></div>
        <div class="nav-item" onclick="window.location.href='lager.html'"><span class="material-symbols-outlined">inventory</span><span>Lager</span></div>
        <div class="nav-item" onclick="window.location.href='kunden.html'"><span class="material-symbols-outlined">group</span><span>Kunden</span></div>
    </nav>

    <script src="db.js?v=7"></script>
    <script src="app.js?v=7"></script>
</body>
</html>
