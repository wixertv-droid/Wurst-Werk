<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Wurstwerk</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=80">
    
    <style>
        body { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100dvh; background-color: var(--bg-color); margin: 0; padding: 0; overflow: hidden;
        }
        
        .vault-container { text-align: center; width: 100%; max-width: 350px; padding: 20px; }
        
        .logo-area { margin-bottom: 40px; }
        .logo-area .material-symbols-outlined { font-size: 4rem; color: var(--accent-amber); margin-bottom: 10px; }
        .logo-text { font-size: 1.8rem; font-weight: 800; letter-spacing: 4px; text-transform: uppercase; color: white; }
        .sub-text { color: var(--text-muted); font-size: 0.9rem; letter-spacing: 2px; text-transform: uppercase; margin-top: 5px; }

        /* Die 4 PIN-Punkte */
        .pin-display { display: flex; justify-content: center; gap: 20px; margin-bottom: 40px; height: 20px; }
        .pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #444; transition: 0.2s ease; }
        .pin-dot.filled { background-color: var(--accent-amber); border-color: var(--accent-amber); box-shadow: 0 0 10px rgba(255, 140, 0, 0.5); }
        .pin-dot.error { background-color: var(--accent-danger); border-color: var(--accent-danger); box-shadow: 0 0 10px rgba(255, 68, 68, 0.5); }

        /* Das Numpad */
        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; justify-items: center; }
        .num-btn { 
            width: 75px; height: 75px; border-radius: 50%; background: #1a1a1a; border: 2px solid #222; 
            color: white; font-size: 1.8rem; font-weight: 600; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.1s; user-select: none;
        }
        .num-btn:active { background: var(--accent-amber); color: #000; transform: scale(0.95); border-color: var(--accent-amber); }
        .num-btn.empty { background: transparent; border: none; cursor: default; }
        .num-btn.empty:active { transform: none; }
        .num-btn.del { background: #1a1a1a; color: var(--text-muted); font-size: 1.5rem; }

        /* Fehler-Wackeln */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        .shake { animation: shake 0.4s; }
    </style>
</head>
<body>

    <div class="vault-container" id="vault">
        <div class="logo-area">
            <span class="material-symbols-outlined">lock</span>
            <div class="logo-text">Wurstwerk</div>
            <div class="sub-text" id="status-text">System gesperrt</div>
        </div>

        <div class="pin-display" id="pin-dots">
            <div class="pin-dot"></div>
            <div class="pin-dot"></div>
            <div class="pin-dot"></div>
            <div class="pin-dot"></div>
        </div>

        <div class="numpad">
            <div class="num-btn" onclick="vault.addNumber(1)">1</div>
            <div class="num-btn" onclick="vault.addNumber(2)">2</div>
            <div class="num-btn" onclick="vault.addNumber(3)">3</div>
            
            <div class="num-btn" onclick="vault.addNumber(4)">4</div>
            <div class="num-btn" onclick="vault.addNumber(5)">5</div>
            <div class="num-btn" onclick="vault.addNumber(6)">6</div>
            
            <div class="num-btn" onclick="vault.addNumber(7)">7</div>
            <div class="num-btn" onclick="vault.addNumber(8)">8</div>
            <div class="num-btn" onclick="vault.addNumber(9)">9</div>
            
            <div class="num-btn empty"></div>
            <div class="num-btn" onclick="vault.addNumber(0)">0</div>
            <div class="num-btn del" onclick="vault.deleteNumber()"><span class="material-symbols-outlined">backspace</span></div>
        </div>
    </div>

    <script src="app.js?v=80"></script>
    <script>
        window.vault = {
            enteredPin: "",
            realPin: "0000", // Fallback, falls DB lädt

            init: async function() {
                // Holt den echten PIN aus Supabase
                try {
                    const res = await fetch(`${supabaseUrl}/rest/v1/app_settings?id=eq.1&select=pin_code`, {
                        headers: { 'apikey': supabaseKey, 'Authorization': `Bearer ${supabaseKey}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        if (data.length > 0) this.realPin = data[0].pin_code;
                    }
                } catch(e) { console.error("Konnte PIN nicht laden", e); }
            },

            addNumber: function(num) {
                if (this.enteredPin.length < 4) {
                    this.enteredPin += num;
                    this.updateDots();
                    
                    if (this.enteredPin.length === 4) {
                        setTimeout(() => this.checkPin(), 150);
                    }
                }
            },

            deleteNumber: function() {
                if (this.enteredPin.length > 0) {
                    this.enteredPin = this.enteredPin.slice(0, -1);
                    this.updateDots();
                }
            },

            updateDots: function(isError = false) {
                const dots = document.querySelectorAll('.pin-dot');
                dots.forEach((dot, index) => {
                    dot.className = 'pin-dot'; // Reset
                    if (isError) {
                        dot.classList.add('error');
                    } else if (index < this.enteredPin.length) {
                        dot.classList.add('filled');
                    }
                });
            },

            checkPin: function() {
                if (this.enteredPin === this.realPin) {
                    // PIN KORREKT!
                    document.getElementById('status-text').innerText = "ZUGANG GEWÄHRT";
                    document.getElementById('status-text').style.color = "var(--success-green)";
                    document.querySelector('.material-symbols-outlined').innerText = "lock_open";
                    document.querySelector('.material-symbols-outlined').style.color = "var(--success-green)";
                    
                    // Türsteher-Ticket ausstellen
                    sessionStorage.setItem('wurstwerk_auth', 'granted');
                    
                    // Weiterleiten zum Dashboard
                    setTimeout(() => {
                        window.location.replace('dashboard.html');
                    }, 500);
                } else {
                    // PIN FALSCH!
                    this.updateDots(true);
                    const container = document.getElementById('vault');
                    container.classList.add('shake');
                    
                    setTimeout(() => {
                        container.classList.remove('shake');
                        this.enteredPin = "";
                        this.updateDots();
                    }, 400);
                }
            }
        };

        // Startet das Laden des PINs
        document.addEventListener('DOMContentLoaded', () => window.vault.init());
    </script>
</body>
</html>
