<header class="main-header">
    <div class="header-content">
        <span class="brand">WURSTWERK</span>
        <div class="header-stats">
            <span class="material-symbols-outlined">history</span>
            <small>Letzter Scan: Heute 14:20</small>
        </div>
    </div>
</header>

<main>
    <div id="view-home" class="view active">
        <div class="section-title">Neuer Wareneingang</div>
        <div class="purchase-container">
            <div class="input-card">
                <div class="input-row">
                    <div class="input-group">
                        <label>Produktname</label>
                        <input type="text" id="buy-name" placeholder="z.B. Bauch, Nacken..." onkeyup="assistant.checkExisting()">
                        <div id="duplicate-hint" class="hint-badge" style="display:none;">Bereits im Lager</div>
                    </div>
                </div>
                
                <div class="input-row" style="display: flex; gap: 10px;">
                    <div class="input-group" style="flex: 2;">
                        <label>Menge (g / Stk)</label>
                        <input type="number" id="buy-amount" placeholder="0">
                    </div>
                    <div class="input-group" style="flex: 1;">
                        <label>Preis (€)</label>
                        <input type="number" step="0.01" id="buy-price" placeholder="0.00">
                    </div>
                </div>

                <button class="save-btn" onclick="assistant.processPurchase()">
                    <span class="material-symbols-outlined">add_task</span> Einlagern
                </button>
            </div>
        </div>

        <div class="section-title">Kürzlich eingekauft</div>
        <div id="recent-purchases" class="recent-list">
            </div>
    </div>
    </main>
