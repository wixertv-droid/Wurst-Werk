<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Wurstwerk</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>Wurstwerk</header>

    <main>
        <div id="view-home" class="view active">
            <div class="smoker-card">
                <span class="material-symbols-outlined" style="font-size: 2.5rem; color: var(--accent-amber);">local_fire_department</span>
                <div id="process-timer" class="timer-display">00:00:00</div>
                <p class="text-muted">Willkommen im Wurstwerk</p>
            </div>

            <button class="action-btn" style="margin-top: 25px; height: 60px; font-size: 1.1rem; background-color: #2e7d32; color: white;" onclick="window.location.href='einkauf.html'">
                <span class="material-symbols-outlined">add_shopping_cart</span> Neuen Einkauf erfassen
            </button>

            <div class="section-title">Laufende Reifeprozesse</div>
            <div id="active-processes-list"></div>
            
            <div class="dashboard-grid">
                <div class="stat-card">
                    <span class="material-symbols-outlined">inventory_2</span>
                    <span id="stat-gläser" class="stat-value">0</span>
                    <span class="stat-label">Gläser</span>
                </div>
                <div class="stat-card">
                    <span class="material-symbols-outlined">payments</span>
                    <span id="stat-wert" class="stat-value">0.00</span>
                    <span class="stat-label">Lagerwert (€)</span>
                </div>
            </div>
        </div>

        <div id="view-rezepte" class="view">
            <div class="section-title">Rezeptbuch</div>
            <div id="recipe-list"></div>
        </div>

        <div id="view-lager" class="view">
            <div class="section-title">Lagerbestand</div>
            <div id="inventory-list"></div>
        </div>

        <div id="view-kunden" class="view">
            <div class="section-title">Kunden</div>
            <div id="customer-list"></div>
        </div>
    </main>

    <nav>
        <div class="nav-item active" onclick="app.switchView('home', this)"><span class="material-symbols-outlined">dashboard</span><span>Home</span></div>
        <div class="nav-item" onclick="app.switchView('rezepte', this)"><span class="material-symbols-outlined">menu_book</span><span>Rezepte</span></div>
        <div class="nav-item" onclick="app.switchView('lager', this)"><span class="material-symbols-outlined">inventory</span><span>Lager</span></div>
        <div class="nav-item" onclick="app.switchView('kunden', this)"><span class="material-symbols-outlined">group</span><span>Kunden</span></div>
    </nav>

    <script src="db.js"></script>
    <script src="app.js"></script>
    <script src="production.js"></script>
</body>
</html>
