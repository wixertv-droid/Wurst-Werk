<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Wurstwerk</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>Wurstwerk</header>

    <main>
        <div id="view-home" class="view active">
            <div class="smoker-card">
                <span class="material-symbols-outlined" style="font-size: 2.5rem; color: var(--accent-amber);">local_fire_department</span>
                <div class="timer-display" id="main-timer">00:00:00</div>
                <p class="text-muted">Bereit für Produktion</p>
            </div>
            
            <div class="dashboard-grid">
                <div class="stat-card">
                    <span class="material-symbols-outlined">inventory_2</span>
                    <span id="stat-gläser" class="stat-value">--</span>
                    <span class="stat-label">Gläser</span>
                </div>
                <div class="stat-card">
                    <span class="material-symbols-outlined">payments</span>
                    <span id="stat-wert" class="stat-value">--</span>
                    <span class="stat-label">Lagerwert (€)</span>
                </div>
            </div>

            <div id="suggestion-box" class="suggestion-card" style="display: none;">
                <div class="icon-box"><span class="material-symbols-outlined" style="color: #4d4dff;">lightbulb</span></div>
                <div id="suggestion-text" class="info" style="font-size: 0.85rem;"></div>
            </div>

            <div class="section-title">Einkauf erfassen</div>
            <div class="stat-card" style="border: 1px solid #2e7d32;">
                <div class="input-group">
                    <label>Was hast du gekauft?</label>
                    <input type="text" id="buy-name" placeholder="z.B. Nacken, Bauch...">
                </div>
                <div class="input-group">
                    <label>Kategorie</label>
                    <select id="buy-category">
                        <option value="Fleisch">Fleisch</option>
                        <option value="Gewürz">Gewürz / Salz</option>
                        <option value="Material">Material (Darm, Glas)</option>
                    </select>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="input-group" style="flex: 1;">
                        <label>Menge (g/Stk)</label>
                        <input type="number" id="buy-amount" placeholder="3000">
                    </div>
                    <div class="input-group" style="flex: 1;">
                        <label>Preis (€ gesamt)</label>
                        <input type="number" step="0.01" id="buy-price" placeholder="24.50">
                    </div>
                </div>
                <button class="action-btn" style="background-color: #2e7d32; color: white;" onclick="assistant.processPurchase()">
                    <span class="material-symbols-outlined">save</span> In Datenbank speichern
                </button>
            </div>
        </div>

        <div id="view-rezepte" class="view">
            <div class="section-title">Rezepte</div>
            <div id="recipe-list"></div>
        </div>

        <div id="view-lager" class="view">
            <div class="section-title">Aktueller Lagerbestand</div>
            <div id="inventory-list"></div>
        </div>

        <div id="view-kunden" class="view">
            <div class="section-title">Kundenverwaltung</div>
            <div id="customer-list"></div>
        </div>
    </main>

    <nav>
        <div class="nav-item active" onclick="app.switchView('home', this)">
            <span class="material-symbols-outlined">dashboard</span><span>Home</span>
        </div>
        <div class="nav-item" onclick="app.switchView('rezepte', this)">
            <span class="material-symbols-outlined">menu_book</span><span>Rezepte</span>
        </div>
        <div class="nav-item" onclick="app.switchView('lager', this)">
            <span class="material-symbols-outlined">inventory</span><span>Lager</span>
        </div>
        <div class="nav-item" onclick="app.switchView('kunden', this)">
            <span class="material-symbols-outlined">group</span><span>Kunden</span>
        </div>
    </nav>

    <script src="db.js"></script>
    <script src="app.js"></script>
    <script src="production.js"></script>
    <script src="assistant.js"></script>
</body>
</html>
