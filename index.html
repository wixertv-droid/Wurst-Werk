<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Wurstwerk</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>Wurstwerk</header>

    <main>
        <div class="smoker-card">
            <span class="material-symbols-outlined" style="font-size: 2.5rem; color: var(--accent-amber);">local_fire_department</span>
            <div id="process-timer" class="timer-display">00:00:00</div>
            <p class="text-muted">Dashboard Übersicht</p>
        </div>

        <button class="action-btn" style="margin-top: 25px; height: 60px; background-color: #2e7d32; color: white;" onclick="window.location.href='einkauf.html'">
            <span class="material-symbols-outlined">add_shopping_cart</span> Neuen Einkauf erfassen
        </button>

        <div class="section-title">Laufende Reifeprozesse</div>
        <div id="active-processes-list"><p class="text-muted">Keine aktiven Prozesse.</p></div>
        
        <div class="dashboard-grid">
            <div class="stat-card" style="border-top: 3px solid #4d4dff;">
                <div style="display: flex; align-items: center; justify-content: space-between;">
                    <span class="stat-label" style="font-weight: bold; color: #4d4dff;">Gläser im Regal</span>
                    <span class="material-symbols-outlined" style="color: #4d4dff;">recycling</span>
                </div>
                <div style="display: flex; justify-content: space-around; margin-top: 15px;">
                    <div style="text-align: center;">
                        <span id="stat-glaeser-250" class="stat-value" style="font-size: 1.4rem;">0</span>
                        <div class="stat-label">250ml</div>
                    </div>
                    <div style="width: 1px; background-color: #333;"></div>
                    <div style="text-align: center;">
                        <span id="stat-glaeser-400" class="stat-value" style="font-size: 1.4rem;">0</span>
                        <div class="stat-label">400ml</div>
                    </div>
                </div>
            </div>

            <div class="stat-card" style="border-top: 3px solid #4caf50;">
                <div style="display: flex; align-items: center; justify-content: space-between;">
                    <span class="stat-label" style="font-weight: bold; color: #4caf50;">Warenwert</span>
                    <span class="material-symbols-outlined" style="color: #4caf50;">payments</span>
                </div>
                <div style="text-align: center; margin-top: 15px;">
                    <span id="stat-wert" class="stat-value" style="font-size: 1.4rem;">0.00</span>
                    <span style="color: #4caf50;">€</span>
                </div>
            </div>
        </div>
    </main>

    <nav>
        <div class="nav-item active"><span class="material-symbols-outlined">dashboard</span><span>Home</span></div>
        <div class="nav-item" onclick="window.location.href='rezepte.html'"><span class="material-symbols-outlined">menu_book</span><span>Rezepte</span></div>
        <div class="nav-item" onclick="window.location.href='lager.html'"><span class="material-symbols-outlined">inventory</span><span>Lager</span></div>
        <div class="nav-item" onclick="window.location.href='kunden.html'"><span class="material-symbols-outlined">group</span><span>Kunden</span></div>
    </nav>

    <script src="db.js"></script>
    <script src="app.js"></script>
</body>
</html>
