<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System Login - Wurstwerk Core</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=90">
    
    <style>
        /* =======================================================
           1. DER FUTURISTISCHE JARVIS-LOOK
           ======================================================= */
        body { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100dvh; background-color: var(--bg-color); margin: 0; padding: 0; overflow: hidden;
            font-family: monospace; /* Futuristische Festbreitenschrift */
        }

        /* Feines, gealtertes Wurstwerk-Orange-Gittermuster im Hintergrund */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255, 140, 0, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 140, 0, 0.05) 1px, transparent 1px);
            background-size: 30px 30px; z-index: -1;
        }

        /* Scan-Linien, die über das Display laufen */
        body::after {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(transparent, transparent 2px, rgba(255, 140, 0, 0.03) 3px);
            z-index: -1; animation: scan 10s linear infinite; opacity: 0.5;
        }
        @keyframes scan { from { transform: translateY(-100%); } to { transform: translateY(100%); } }

        /* Intro Loader (wie Agenda 2050) */
        .loader-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s ease;
        }
        .cyber-spinner {
            width: 50px; height: 50px;
            border: 4px solid #222; border-top-color: var(--accent-amber);
            border-radius: 50%; animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        .loader-text {
            color: var(--accent-amber); font-weight: bold; letter-spacing: 3px;
            text-transform: uppercase; font-size: 0.9rem;
            animation: pulse 1.5s infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* =======================================================
           2. DAS HUD & DATENANZEIGEN (Jarvis Style)
           ======================================================= */
        .vault-wrapper {
            position: relative; width: 100%; max-width: 350px; padding: 20px; text-align: center;
        }

        /* Wurstwerk-Logo und Titel (Oben Mitte, über dem HUD) */
        .brand-header { margin-bottom: 10px; text-align: center;}
        .brand-title {
            font-size: 2.2rem; font-weight: 900; letter-spacing: 5px; text-transform: uppercase;
            color: var(--accent-amber); text-shadow: 0 0 15px rgba(255, 140, 0, 0.4);
        }

        /* Zentraler holografischer HUD-Kreis (wie Agenda 2050) */
        .holographic-hud {
            position: relative; width: 320px; height: 320px; margin: 0 auto;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
        /* Äußerer gestrichelter Kreis */
        .holographic-hud::before {
            content: ""; position: absolute; top: -15px; left: -15px; width: calc(100% + 30px); height: calc(100% + 30px);
            border: 2px dashed rgba(255, 140, 0, 0.15); border-radius: 50%;
        }
        /* Dicker innerer leuchtender Kreis */
        .holographic-hud::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border: 3px solid rgba(255, 140, 0, 0.3); border-radius: 50%;
            box-shadow: 0 0 30px rgba(255, 140, 0, 0.2); animation: rotateHud 15s linear infinite;
        }
        @keyframes rotateHud { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* Dateneinblendungen (Jarvis Style, Oben Links) */
        .jarvis-data-box { 
            position: absolute; top: -20px; left: -30px; text-align: left; 
            border-top: 1px solid rgba(255, 140, 0, 0.3); border-left: 1px solid rgba(255, 140, 0, 0.3);
            padding: 10px 15px; border-radius: 4px; z-index: 10;
        }
        .data-item { color: var(--accent-amber); font-size: 0.75rem; margin-bottom: 4px; letter-spacing: 1px;}
        .data-item.bold { font-weight: bold; text-transform: uppercase; }

        /* Holografische Aktivitätsbalken (Rechts) */
        .holographic-side-bar {
            position: absolute; right: -25px; top: 30px; height: 180px; width: 6px;
            background: rgba(255, 140, 0, 0.1); border-radius: 3px; overflow: hidden;
        }
        .side-bar-fill {
            width: 100%; height: 60%; background: var(--accent-amber);
            border-radius: 3px; box-shadow: 0 0 10px rgba(255, 140, 0, 0.5);
            animation: moveBar 2.5s infinite linear;
        }
        @keyframes moveBar { 0% { height: 10%; } 50% { height: 70%; } 100% { height: 10%; } }

        /* =======================================================
           3. DAS ECKIGERE MATRIX-NUMPAD
           ======================================================= */
        /* Die 4 eckigen PIN-Boxen (Oben Mitte, im HUD) */
        .pin-display { 
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            display: flex; justify-content: center; gap: 12px; margin-bottom: 30px; 
            z-index: 20;
        }
        .pin-box { 
            width: 20px; height: 20px; background: #111; border: 2px solid #333; 
            border-radius: 4px; transition: 0.2s ease; 
        }
        .pin-box.filled { 
            background-color: var(--accent-amber); border-color: var(--accent-amber); 
            box-shadow: 0 0 12px rgba(255, 140, 0, 0.6); 
        }
        .pin-box.error { 
            background-color: var(--accent-danger); border-color: var(--accent-danger); 
            box-shadow: 0 0 12px rgba(255, 68, 68, 0.6); 
        }

        /* Das Matrix-Numpad (zentriert im HUD) */
        .cyber-numpad { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; 
            width: 250px; z-index: 30; position: relative;
        }
        .cyber-num { 
            background: rgba(26, 26, 26, 0.8); border: 1px solid #333; border-radius: 6px;
            color: white; font-size: 1.8rem; font-weight: bold; font-family: monospace;
            display: flex; align-items: center; justify-content: center; height: 65px;
            cursor: pointer; transition: 0.1s; user-select: none;
        }
        .cyber-num:active { 
            background: var(--accent-amber); color: #000; border-color: var(--accent-amber);
            transform: scale(0.95); box-shadow: 0 0 15px rgba(255, 140, 0, 0.5); 
        }
        
        /* Tasten-Farben */
        .cyber-num.empty { background: transparent; border: none; cursor: default; }
        .cyber-num.empty:active { transform: none; box-shadow: none; background: transparent; }
        
        /* Löschen (X) - Rot-Orange-Gradient */
        .cyber-num.del { 
            background: linear-gradient(rgba(26, 26, 26, 0.8), rgba(255, 68, 68, 0.15)); 
            border-color: rgba(255, 68, 68, 0.3); color: var(--text-muted); 
        }
        .cyber-num.del:active { 
            background: var(--accent-danger); color: white; border-color: var(--accent-danger); 
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.5); 
        }
        /* Bestätigen (✔) - Check-Grün */
        .cyber-num.confirm { 
            background: rgba(76, 175, 80, 0.15); border-color: var(--success-green); 
            color: var(--success-green); 
        }
        .cyber-num.confirm:active { 
            background: var(--success-green); color: white; border-color: var(--success-green); 
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.5); 
        }

        /* Technische Systemmeldungen (Unteres HUD) */
        .hud-system-text {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: var(--accent-amber); font-size: 0.75rem; letter-spacing: 2px;
            text-transform: uppercase; z-index: 20;
        }
        .hud-system-text .bold { font-weight: bold; color: var(--text-muted); }

        /* Wackeln bei Fehler */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        .shake { animation: shake 0.4s; }

        /* Ganz unten: AWAITING OPERATOR INPUT... (Orange, blinkend) */
        .jarvis-final-status {
            margin-top: 40px; color: var(--accent-amber); font-weight: bold; 
            letter-spacing: 3px; text-transform: uppercase; font-size: 0.85rem;
            animation: pulseText 1s infinite;
        }
        @keyframes pulseText { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    </style>
</head>
<body>

    <div class="loader-container" id="app-loader">
        <div class="cyber-spinner"></div>
        <div class="loader-text">ACCESSING SYSTEM...</div>
    </div>

    <div class="vault-wrapper" id="vault">
        
        <div class="brand-header">
            <div class="brand-title">WURSTWERK</div>
        </div>

        <div class="holographic-hud">
            
            <div class="jarvis-data-box">
                <div class="data-item bold">WURST_CORE // ACTIVE [v3.11]</div>
                <div class="data-item">SYSTEM // STATUS: <span style="color:var(--accent-amber);">SECURED</span></div>
                <div class="data-item">TEMP: 32.7°C | FAN: 18% | LOAD: 21.7%</div>
                <div class="data-item" id="date-display">DATE: [LADE...]</div>
                <div class="data-item" id="time-display">TIME: [LADE...]</div>
            </div>

            <div class="pin-display" id="pin-dots">
                <div class="pin-box"></div>
                <div class="pin-box"></div>
                <div class="pin-box"></div>
                <div class="pin-box"></div>
            </div>

            <div class="cyber-numpad">
                <div class="cyber-num" onclick="vault.addNumber(1)">1</div>
                <div class="cyber-num" onclick="vault.addNumber(2)">2</div>
                <div class="cyber-num" onclick="vault.addNumber(3)">3</div>
                
                <div class="cyber-num" onclick="vault.addNumber(4)">4</div>
                <div class="cyber-num" onclick="vault.addNumber(5)">5</div>
                <div class="cyber-num" onclick="vault.addNumber(6)">6</div>
                
                <div class="cyber-num" onclick="vault.addNumber(7)">7</div>
                <div class="cyber-num" onclick="vault.addNumber(8)">8</div>
                <div class="cyber-num" onclick="vault.addNumber(9)">9</div>
                
                <div class="cyber-num del" onclick="vault.deleteNumber()"><span class="material-symbols-outlined">backspace</span></div>
                <div class="cyber-num" onclick="vault.addNumber(0)">0</div>
                <div class="cyber-num confirm" onclick="vault.addNumber(99)"><span class="material-symbols-outlined">check</span></div> </div>

            <div class="hud-system-text">
                <div class="bold">AUTH_REQ</div> // 
                OPERATOR PIN // 4-DIGIT //
                <span style="color:var(--accent-amber);">v3.11</span>
                <div>LOCATION // <span style="color:var(--accent-amber);">Gera, Germany</span></div>
            </div>

            <div class="holographic-side-bar">
                <div class="side-bar-fill"></div>
            </div>

        </div>

        <div class="jarvis-final-status" id="status-text">AWAITING OPERATOR INPUT...</div>

    </div>

    <script src="db.js?v=90"></script>
    <script src="app.js?v=90"></script>
    
    <script>
        window.vault = {
            enteredPin: "",
            realPin: "0000", // Fallback, falls DB lädt

            init: async function() {
                // Intro-Loader kurz anzeigen, dann ausblenden
                setTimeout(() => {
                    const loader = document.getElementById('app-loader');
                    if(loader) { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 500); }
                }, 1500);

                // Holt den echten PIN aus Supabase
                try {
                    const res = await fetch(`${supabaseUrl}/rest/v1/app_settings?id=eq.1&select=pin_code`, {
                        headers: { 'apikey': supabaseKey, 'Authorization': `Bearer ${supabaseKey}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        if (data.length > 0) this.realPin = data[0].pin_code;
                    }
                } catch(e) { console.error("Konnte PIN nicht laden", e); }

                // Startet die holografische Zeitaktualisierung
                this.updateTimeDisplay();
                setInterval(() => this.updateTimeDisplay(), 1000);
            },

            // NEU: Jarvis Style Zeitaktualisierung
            updateTimeDisplay: function() {
                const now = new Date();
                
                // Datum: [YYYY-MM-DD]
                const dateStr = now.toISOString().split('T')[0];
                document.getElementById('date-display').innerText = `DATE: [${dateStr}]`;
                
                // Uhrzeit: [HH:MM:SS]
                const timeStr = now.toTimeString().split(' ')[0];
                document.getElementById('time-display').innerText = `TIME: [${timeStr}]`;
            },

            addNumber: function(num) {
                if (num === 99) { // Bestätigen (Haken) gedrückt
                    if (this.enteredPin.length === 4) {
                        this.checkPin();
                    } else {
                        alert("Bitte gib zuerst einen 4-stelligen PIN ein!");
                    }
                    return;
                }
                
                if (this.enteredPin.length < 4) {
                    this.enteredPin += num;
                    this.updateDots();
                    
                    // Automatische Prüfung, wenn 4 Zahlen eingegeben sind
                    if (this.enteredPin.length === 4) {
                        setTimeout(() => this.checkPin(), 150);
                    }
                }
            },

            deleteNumber: function() {
                if (this
