<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Produktion - Wurstwerk</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
    <style>
        .prod-card { background: var(--surface-color); border: 1px solid #333; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .calc-input { width: 100%; padding: 15px; background: #222; border: 2px solid #4caf50; color: white; border-radius: 8px; font-size: 1.5rem; text-align: center; margin-bottom: 20px; font-weight: bold; }
        .match-row { display: flex; flex-direction: column; gap: 5px; padding: 12px 0; border-bottom: 1px dashed #333; }
        .match-header { display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; }
        .match-select { width: 100%; padding: 10px; background: #111; border: 1px solid #444; color: white; border-radius: 6px; font-size: 0.95rem; }
        .match-select.matched { border-color: #4caf50; }
        .match-select.unmatched { border-color: var(--accent-danger); }
        
        .check-step { padding: 15px; background: #111; border-radius: 8px; margin-bottom: 12px; border-left: 4px solid #444; transition: all 0.3s ease; }
        .check-step.done { border-left-color: #4caf50; opacity: 0.7; }
        .check-step.running { border-left-color: #4d4dff; background: rgba(77, 77, 255, 0.05); }
        
        .step-header { display: flex; gap: 15px; align-items: center; cursor: pointer; }
        .check-btn { background: #222; border: 2px solid #444; border-radius: 50%; min-width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; color: transparent; }
        .check-step.done .check-btn { background: #4caf50; border-color: #4caf50; color: white; }
        
        .timer-controls { display: flex; gap: 10px; margin-top: 15px; padding-left: 50px; }
        .btn-start { background: #4d4dff; color: white; border: none; padding: 10px; border-radius: 8px; flex: 1; font-weight: bold; cursor: pointer; }
        .btn-skip { background: #333; color: white; border: 1px solid #555; padding: 10px; border-radius: 8px; flex: 1; cursor: pointer; }
    </style>
</head>
<body>

    <main id="main-content">
        
        <div id="step-1-setup">
            <div class="sub-header" style="margin-bottom: 0;">
                <a href="rezepte.html" class="back-btn"><span class="material-symbols-outlined">arrow_back_ios</span> Abbrechen</a>
                <div class="header-title" id="prod-title">Produktion startet...</div>
            </div>

            <div class="prod-card" style="border-top: 3px solid #4caf50; margin-top: 20px;">
                <label style="display: block; color: #4caf50; font-weight: bold; text-align: center; margin-bottom: 10px; text-transform: uppercase;">🥩 Wie viel kg Fleischmasse (Gesamt) verarbeitest du heute?</label>
                <input type="number" id="multiplier-input" class="calc-input" value="1.0" step="0.1" oninput="window.produktionManager.recalculate()">
                <p style="text-align: center; font-size: 0.85rem; color: var(--text-muted); margin-top: 0;">Gebe z.B. 2.5 ein, wenn du 2,5 kg Fleisch hast. Alle Gewürze werden automatisch angepasst!</p>
            </div>

            <div class="section-title">Lager-Abgleich (Warenabzug)</div>
            <div class="prod-card" id="matching-container">
                <p class="text-muted" style="text-align: center;">Lade Lagerbestand...</p>
            </div>

            <button class="action-btn" style="background-color: var(--accent-amber); color: #000; height: 60px; font-size: 1.1rem; margin-bottom: 40px;" onclick="window.produktionManager.deductAndStart()">
                <span class="material-symbols-outlined">inventory_2</span> Aus Lager abbuchen & Starten
            </button>
        </div>

        <div id="step-2-checklist" style="display: none;">
            <div class="sub-header" style="margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 15px;">
                <div class="back-btn" onclick="window.produktionManager.goBackToSetup()"><span class="material-symbols-outlined">arrow_back_ios</span> Zurück zur Menge</div>
                <div class="header-title" style="color: white;">Ablaufplan</div>
            </div>

            <div class="prod-card" style="border-top: 3px solid #4d4dff;">
                <div id="checklist-container"></div>
            </div>

            <button class="action-btn" style="background-color: #4caf50; color: white; height: 60px; font-size: 1.1rem; margin-bottom: 40px;" onclick="window.produktionManager.finishProduction()">
                <span class="material-symbols-outlined">done_all</span> Produktion in Lager buchen
            </button>
        </div>

    </main>

    <script src="db.js?v=4"></script>
    <script src="produktion.js?v=4"></script>
</body>
</html>
