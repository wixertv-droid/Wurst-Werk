<!DOCTYPE html>
<html lang="de">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Wurstwerk">
    <link rel="apple-touch-icon" href="icon.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Einkauf - Wurstwerk</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
    <style>
        .modern-input {
            width: 100%; padding: 15px; background: #222; border: 1px solid #444;
            color: white; border-radius: 12px; font-size: 1.1rem; box-sizing: border-box;
            transition: all 0.3s ease;
        }
        .modern-input:focus { border-color: var(--accent-amber); outline: none; background: #2a2a2a; }
        .input-label { display: block; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 8px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }
        .form-card { background-color: var(--surface-color); border-radius: 16px; padding: 20px; border: 1px solid #222; margin-top: 15px; }
    </style>
</head>
    <script>
        // Der Wurstwerk-Türsteher: Werft jeden raus, der nicht durch den Tresor kam!
        if (!sessionStorage.getItem('wurstwerk_auth')) {
            window.location.replace('index.html');
        }
    </script>

<body>

    <div class="sub-header">
        <a href="index.html" class="back-btn"><span class="material-symbols-outlined">arrow_back_ios</span> Abbrechen</a>
        <div class="header-title">Wareneingang</div>
    </div>

    <main>
        <div class="form-card">
            
            <div style="margin-bottom: 20px;">
                <label class="input-label">Artikelname</label>
                <input type="text" id="buy-name" class="modern-input" placeholder="z.B. Schweinebauch" onkeyup="assistant.checkItemExists()">
                <div id="item-status" style="display: none; font-size: 0.9rem;"></div>
            </div>
            
            <div style="margin-bottom: 20px;">
                <label class="input-label">Kategorie</label>
                <select id="buy-category" class="modern-input">
                    <option value="Fleisch">🥩 Fleisch (Rohware)</option>
                    <option value="Gewürz">🧂 Gewürze / Salz</option>
                    <option value="Material">📦 Verbrauchsmaterial (Darm)</option>
                    <option value="Maschine">⚙️ Maschine / Zubehör</option>
                </select>
            </div>
            
            <div style="display: flex; gap: 15px; margin-bottom: 20px;">
                <div style="flex: 2;">
                    <label class="input-label">Menge</label>
                    <input type="number" step="0.01" id="buy-amount" class="modern-input" placeholder="0">
                </div>
                <div style="flex: 1;">
                    <label class="input-label">Einheit</label>
                    <select id="buy-unit" class="modern-input">
                        <option value="kg">kg</option>
                        <option value="g">g</option>
                        <option value="Stk">Stück</option>
                        <option value="m">Meter</option>
                    </select>
                </div>
            </div>

            <div style="margin-bottom: 20px;">
                <label class="input-label">Preis gesamt (€)</label>
                <input type="number" step="0.01" id="buy-price" class="modern-input" placeholder="0.00">
            </div>
            
            <button class="action-btn" style="background-color: #2e7d32; color: white; height: 60px; font-size: 1.1rem; border-radius: 12px; margin-top: 10px;" onclick="assistant.processPurchase()">
                <span class="material-symbols-outlined">add_task</span> Im Lager speichern
            </button>
        </div>
    </main>

    <script src="db.js"></script>
    <script src="assistant.js"></script>
</body>
</html>
