<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Einkauf - Wurstwerk</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sub-header">
        <a href="index.html" class="back-btn"><span class="material-symbols-outlined">arrow_back_ios</span> Zurück</a>
        <div class="header-title">Wareneingang</div>
    </div>

    <main>
        <div class="stat-card" style="margin-top: 20px;">
            <div class="input-group">
                <label>Was hast du gekauft?</label>
                <input type="text" id="buy-name" placeholder="z.B. Schweinenacken, Majoran...">
            </div>
            
            <div class="input-group">
                <label>Kategorie</label>
                <select id="buy-category">
                    <option value="Fleisch">🥩 Fleisch</option>
                    <option value="Gewürz">🧂 Gewürze / Salz</option>
                    <option value="Material">📦 Material (Darm, Glas)</option>
                </select>
            </div>
            
            <div style="display: flex; gap: 10px;">
                <div class="input-group" style="flex: 2;">
                    <label>Menge</label>
                    <input type="number" step="0.01" id="buy-amount" placeholder="z.B. 2.5">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>Einheit</label>
                    <select id="buy-unit">
                        <option value="kg">kg</option>
                        <option value="g">g</option>
                        <option value="Stk">Stück</option>
                        <option value="m">Meter</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label>Preis gesamt (€)</label>
                <input type="number" step="0.01" id="buy-price" placeholder="19.90">
            </div>
            
            <button class="action-btn" style="background-color: #2e7d32; color: white; margin-top: 20px; height: 50px;" onclick="assistant.processPurchase()">
                <span class="material-symbols-outlined">save</span> Ins Lager buchen
            </button>
        </div>
    </main>

    <script src="db.js"></script>
    <script src="assistant.js"></script>
</body>
</html>
