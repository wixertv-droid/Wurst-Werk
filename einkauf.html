<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Einkauf - Wurstwerk</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sub-header">
        <a href="index.html" class="back-btn"><span class="material-symbols-outlined">arrow_back_ios</span> Abbrechen</a>
        <div class="header-title">Wareneingang</div>
    </div>

    <main>
        <div class="stat-card" style="margin-top: 10px; border-top: 4px solid var(--accent-amber);">
            
            <div class="input-group">
                <label><span class="material-symbols-outlined" style="font-size: 1rem; vertical-align: middle;">label</span> Artikelname</label>
                <input type="text" id="buy-name" placeholder="z.B. Schweinebauch, Majoran..." style="font-size: 1.1rem;">
            </div>
            
            <div class="input-group">
                <label><span class="material-symbols-outlined" style="font-size: 1rem; vertical-align: middle;">category</span> Kategorie</label>
                <select id="buy-category" style="font-size: 1.1rem;">
                    <option value="Fleisch">🥩 Fleisch</option>
                    <option value="Gewürz">🧂 Gewürze / Salz</option>
                    <option value="Material">📦 Material (Darm, Glas)</option>
                </select>
            </div>
            
            <div style="display: flex; gap: 15px;">
                <div class="input-group" style="flex: 2;">
                    <label><span class="material-symbols-outlined" style="font-size: 1rem; vertical-align: middle;">scale</span> Menge</label>
                    <input type="number" step="0.01" id="buy-amount" placeholder="0.00" style="font-size: 1.1rem;">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>Einheit</label>
                    <select id="buy-unit" style="font-size: 1.1rem;">
                        <option value="kg">kg</option>
                        <option value="g">g</option>
                        <option value="Stk">Stück</option>
                        <option value="m">Meter</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label><span class="material-symbols-outlined" style="font-size: 1rem; vertical-align: middle;">euro</span> Preis gesamt (€)</label>
                <input type="number" step="0.01" id="buy-price" placeholder="0.00" style="font-size: 1.1rem;">
            </div>
            
            <button class="action-btn" style="background-color: #2e7d32; color: white; margin-top: 25px; height: 55px; font-size: 1.1rem;" onclick="assistant.processPurchase()">
                <span class="material-symbols-outlined">inventory_2</span> Im Lager speichern
            </button>
        </div>
    </main>

    <div id="duplicate-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;">
        <div class="stat-card" style="width: 100%; max-width: 400px; text-align: center; border: 1px solid var(--accent-amber);">
            <span class="material-symbols-outlined" style="font-size: 3rem; color: var(--accent-amber); margin-bottom: 10px;">warning</span>
            <h3 style="margin-top: 0;">Artikel existiert bereits!</h3>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Du hast bereits <b id="dup-name" style="color: white;"></b> im Lager (Bestand: <span id="dup-amount" style="color: white;"></span>).</p>
            
            <button class="action-btn" style="background-color: #2e7d32; color: white; margin-bottom: 12px;" onclick="assistant.addToExisting()">
                <span class="material-symbols-outlined">add_circle</span> Zum Bestand addieren
            </button>
            <button class="action-btn" style="background-color: #4d4dff; color: white; margin-bottom: 12px;" onclick="assistant.saveAsNew()">
                <span class="material-symbols-outlined">call_split</span> Als extra Posten anlegen
            </button>
            <button class="action-btn" style="background-color: transparent; border: 1px solid #555; color: white;" onclick="document.getElementById('duplicate-modal').style.display='none'">
                Abbrechen
            </button>
        </div>
    </div>

    <script src="db.js"></script>
    <script src="assistant.js"></script>
</body>
</html>
