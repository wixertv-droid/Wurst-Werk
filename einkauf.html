<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Einkauf - Wurstwerk</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
    <style>
        /* Spezieller Header für Unterseiten mit Zurück-Button */
        .sub-header {
            display: flex; align-items: center; padding: 20px; 
            padding-top: env(safe-area-inset-top, 40px);
            background-color: var(--nav-bg); border-bottom: 1px solid #333;
        }
        .back-btn {
            color: var(--accent-amber); cursor: pointer; display: flex; align-items: center;
            font-size: 1.1rem; text-decoration: none; font-weight: bold;
        }
        .header-title { flex: 1; text-align: center; font-weight: 600; text-transform: uppercase; margin-right: 30px; }
    </style>
</head>
<body>

    <div class="sub-header">
        <a href="index.html" class="back-btn"><span class="material-symbols-outlined">arrow_back_ios</span> Zurück</a>
        <div class="header-title">Wareneingang</div>
    </div>

    <main>
        <div class="stat-card" style="margin-top: 20px;">
            <div class="input-group">
                <label>Was hast du gekauft?</label>
                <input type="text" id="buy-name" placeholder="z.B. Schweinenacken">
            </div>
            
            <div class="input-group">
                <label>Kategorie</label>
                <select id="buy-category">
                    <option value="Fleisch">🥩 Fleisch</option>
                    <option value="Gewürz">🧂 Gewürze / Salz</option>
                    <option value="Material">📦 Material (Darm, Glas)</option>
                </select>
            </div>
            
            <div style="display: flex; gap: 10px;">
                <div class="input-group" style="flex: 1;">
                    <label>Menge (g/Stk/m)</label>
                    <input type="number" id="buy-amount" placeholder="2500">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>Preis (€)</label>
                    <input type="number" step="0.01" id="buy-price" placeholder="19.90">
                </div>
            </div>
            
            <button class="action-btn" style="background-color: #2e7d32; color: white; margin-top: 20px; height: 50px;" onclick="assistant.processPurchase()">
                <span class="material-symbols-outlined">save</span> Ins Lager buchen
            </button>
        </div>
    </main>

    <script src="db.js"></script>
    <script src="assistant.js"></script>
</body>
</html>
